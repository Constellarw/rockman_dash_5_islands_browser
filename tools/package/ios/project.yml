name: RockmanDASH
options:
  bundleIdPrefix: app.rdash
  deploymentTarget:
    iOS: "15.0"
targets:
  RockmanDASH:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/game.html
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rdash.ios
        INFOPLIST_FILE: Config/Info.plist
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
